name: Auditoria de publicacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  segredos-e-licenca:
    name: Segredos e licenca
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auditar arquivos rastreados
        run: bash scripts/audit-publication.sh
