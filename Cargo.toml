[workspace]
members = [
    "apps/bear-linux",
    "crates/bear-core",
    "crates/bear-i18n",
    "crates/bear-storage",
    "crates/bear-adblock",
    "crates/bear-privacy",
    "crates/bear-tabs",
    "crates/bear-settings",
    "crates/bear-diagnostics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BEAR Browser Team <engineering@bearbrowser.org>"]
license = "Apache-2.0"
repository = "https://github.com/bear-browser/bear-browser"
homepage = "https://bearbrowser.org"
description = "BEAR Browser — Navegador web rápido, leve e privado para Linux"

[workspace.dependencies]
# GTK & Libadwaita
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
cairo-rs = "0.22"

# CEF integration
cef = { version = "156.3.0", default-features = false }
cef-dll-sys = "156.3.0"

# Utilities & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1.11"
ureq = "3.5"

# Internal crates
bear-core = { path = "crates/bear-core" }
bear-i18n = { path = "crates/bear-i18n" }
bear-storage = { path = "crates/bear-storage" }
bear-adblock = { path = "crates/bear-adblock" }
bear-privacy = { path = "crates/bear-privacy" }
bear-tabs = { path = "crates/bear-tabs" }
bear-settings = { path = "crates/bear-settings" }
bear-diagnostics = { path = "crates/bear-diagnostics" }

# Otimizações de compilação
[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
overflow-checks = false
