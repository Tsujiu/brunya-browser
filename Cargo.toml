[workspace]
members = [
    "apps/brunya-linux",
    "crates/brunya-core",
    "crates/brunya-i18n",
    "crates/brunya-storage",
    "crates/brunya-adblock",
    "crates/brunya-privacy",
    "crates/brunya-tabs",
    "crates/brunya-settings",
    "crates/brunya-diagnostics",
    "crates/brunya-updater",
    "crates/brunya-extensions",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Brunya Browser Team <engineering@brunyabrowser.org>"]
license = "Apache-2.0"
repository = "https://github.com/Tsujiu/brunya-browser"
homepage = "https://brunyabrowser.org"
description = "Brunya Browser — Navegador web rápido, leve e privado para Linux"

[workspace.dependencies]
# GTK & Libadwaita
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
cairo-rs = "0.22"
webkit6 = "0.6"

# CEF integration
cef = { version = "156.3.0", default-features = false }
cef-dll-sys = "156.3.0"

# Utilities & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
regex = "1.11"
ureq = "3.5"
ring = "0.17"
libc = "0.2"

# Internal crates
brunya-core = { path = "crates/brunya-core" }
brunya-i18n = { path = "crates/brunya-i18n" }
brunya-storage = { path = "crates/brunya-storage" }
brunya-adblock = { path = "crates/brunya-adblock" }
brunya-privacy = { path = "crates/brunya-privacy" }
brunya-tabs = { path = "crates/brunya-tabs" }
brunya-settings = { path = "crates/brunya-settings" }
brunya-diagnostics = { path = "crates/brunya-diagnostics" }
brunya-updater = { path = "crates/brunya-updater" }
brunya-extensions = { path = "crates/brunya-extensions" }

# Otimizações de compilação
[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
overflow-checks = false
